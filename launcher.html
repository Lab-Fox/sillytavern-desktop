<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SillyTavern Desktop</title>
<style>
  :root {
    --bg: #0f0e14;
    --panel: #1a1922;
    --panel2: #212030;
    --accent: #7c6cf0;
    --accent2: #9d8cff;
    --good: #4ade80;
    --bad: #f87171;
    --text: #e8e6f0;
    --muted: #8b87a3;
    --border: #2e2c3f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    user-select: none;
  }
  header {
    padding: 18px 24px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #c084fc);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  header .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .status {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }

  main { flex: 1; display: flex; min-height: 0; }
  .actions {
    width: 300px; padding: 18px; display: flex; flex-direction: column;
    gap: 10px; border-right: 1px solid var(--border); overflow-y: auto;
  }
  .btn {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 13px 16px; border-radius: 10px;
    font-size: 13.5px; cursor: pointer; text-align: left;
    transition: background .12s, border-color .12s, transform .05s;
    font-family: inherit;
  }
  .btn:hover { background: var(--panel2); border-color: var(--accent); }
  .btn:active { transform: scale(.985); }
  .btn .ico { font-size: 17px; width: 22px; text-align: center; }
  .btn small { display: block; color: var(--muted); font-size: 10.5px; margin-top: 2px; }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), #6d5ce0);
    border-color: transparent; font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn.danger:hover { border-color: var(--bad); }

  .right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .console-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .console-head {
    padding: 10px 16px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.2px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .console-head button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-size: 10px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
  }
  .console-head button:hover { color: var(--text); border-color: var(--accent); }
  #console {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px;
    line-height: 1.55; white-space: pre-wrap; word-break: break-all;
    color: #b9b6cc; user-select: text;
  }
  #console .err { color: var(--bad); }
  #console .ok { color: var(--good); }

  .settings-pane {
    display: none; padding: 18px; gap: 14px; flex-direction: column;
    overflow-y: auto;
  }
  .settings-pane.show { display: flex; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .8px; }
  .field input[type=text], .field input[type=number] {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 13px;
    font-family: inherit; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .actions::-webkit-scrollbar, #console::-webkit-scrollbar, .settings-pane::-webkit-scrollbar { width: 8px; }
  .actions::-webkit-scrollbar-thumb, #console::-webkit-scrollbar-thumb, .settings-pane::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <div class="logo">🍺</div>
    <div>
      <h1>SillyTavern Desktop</h1>
      <div class="sub">standalone build · no cmd · built-in browser</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Server stopped</span></div>
  </header>

  <main>
    <div class="actions">
      <button class="btn primary" id="btnOpen"><span class="ico">▶</span><span>Open SillyTavern<span id="openSub"><small>starts server + opens window</small></span></span></button>
      <button class="btn" id="btnStop"><span class="ico">⏹</span><span>Stop server<small>kills the hidden node process</small></span></button>
      <button class="btn" id="btnUpdate"><span class="ico">⟳</span><span>Update SillyTavern<small>git pull — safe, wrapper survives</small></span></button>
      <button class="btn" id="btnBackup"><span class="ico">💾</span><span>Back up data<small>zips your data/ folder</small></span></button>
      <button class="btn" id="btnData"><span class="ico">📂</span><span>Open data folder<small>chats, characters, settings</small></span></button>
      <button class="btn" id="btnVersion"><span class="ico">🏷</span><span>Show current version<small>latest local commit</small></span></button>
      <button class="btn" id="btnSettings"><span class="ico">⚙</span><span>Settings<small>path, port, behavior</small></span></button>
    </div>

    <div class="right">
      <div class="console-wrap" id="consoleWrap">
        <div class="console-head"><span>Server console</span><button id="btnClear">clear</button></div>
        <div id="console"></div>
      </div>
      <div class="settings-pane" id="settingsPane">
        <div class="field">
          <label>SillyTavern folder</label>
          <input type="text" id="setPath" placeholder="F:\SillyTavern-Launcher\SillyTavern">
        </div>
        <div class="field">
          <label>Port</label>
          <input type="number" id="setPort" placeholder="8000">
        </div>
        <label class="check"><input type="checkbox" id="setAuto"> Start server automatically when app opens</label>
        <label class="check"><input type="checkbox" id="setConfirm"> Confirm before quitting while server runs</label>
        <div class="hint">Changing the port here only changes where this app looks — also set it in SillyTavern's config.yaml if you deviate from 8000.</div>
        <div><button class="btn primary" id="btnSaveSettings" style="justify-content:center"><span class="ico">✓</span>Save settings</button></div>
      </div>
    </div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const cons = $('console');
  let running = false;

  function append(line) {
    const div = document.createElement('div');
    if (/error|failed|exited/i.test(line)) div.className = 'err';
    else if (/complete|finished|started|listening|running/i.test(line)) div.className = 'ok';
    div.textContent = line;
    cons.appendChild(div);
    while (cons.childElementCount > 600) cons.removeChild(cons.firstChild);
    cons.scrollTop = cons.scrollHeight;
  }

  function setRunning(v) {
    running = v;
    $('dot').classList.toggle('on', v);
    $('statusText').textContent = v ? 'Server running' : 'Server stopped';
    $('openSub').textContent = v ? 'server already up — opens window' : 'starts server + opens window';
  }

  window.desktop.onLog(append);
  window.desktop.onStarted(() => setRunning(true));
  window.desktop.onStopped(() => setRunning(false));

  $('btnOpen').onclick = async () => { append('→ launching SillyTavern...'); await window.desktop.openST(); };
  $('btnStop').onclick = () => window.desktop.stopServer();
  $('btnUpdate').onclick = () => window.desktop.update();
  $('btnBackup').onclick = () => window.desktop.backup();
  $('btnData').onclick = () => window.desktop.openDataFolder();
  $('btnVersion').onclick = () => window.desktop.gitVersion();
  $('btnClear').onclick = () => cons.innerHTML = '';
  $('btnSettings').onclick = () => {
    $('settingsPane').classList.toggle('show');
    $('consoleWrap').style.display = $('settingsPane').classList.contains('show') ? 'none' : 'flex';
  };
  $('btnSaveSettings').onclick = async () => {
    await window.desktop.saveSettings({
      sillytavernPath: $('setPath').value,
      port: parseInt($('setPort').value, 10) || 8000,
      autoStart: $('setAuto').checked,
      confirmBeforeQuit: $('setConfirm').checked,
    });
    append('✓ Settings saved.');
  };

  (async () => {
    const state = await window.desktop.getState();
    state.logs.forEach(append);
    setRunning(state.running);
    $('setPath').value = state.settings.sillytavernPath;
    $('setPort').value = state.settings.port;
    $('setAuto').checked = state.settings.autoStart;
    $('setConfirm').checked = state.settings.confirmBeforeQuit;
  })();
</script>
</body>
</html>
