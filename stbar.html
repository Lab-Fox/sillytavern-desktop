<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: crx: http://127.0.0.1:* http://localhost:*">
<title>bar</title>
<style>
  @font-face { font-family: "Pixelify Sans"; src: url("fonts/pixelify-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Pixelify Sans"; src: url("fonts/pixelify-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Departure Mono"; src: url("fonts/departure-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "DotGothic16"; src: url("fonts/dotgothic16-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "VT323"; src: url("fonts/vt323-latin-400-normal.woff2") format("woff2"); }
  /* Same base colors as the launcher theme (set from bar:state). */
  :root {
    --bg: #1c1d21; --panel: #26272d; --border: #3d3e47; --accent: #d65a52;
    --text: #d9d7d0; --title: #efede6; --muted: #9c9ba4; --warn: #e6c36a;
    --tint: color-mix(in srgb, var(--accent) 18%, transparent);
    --px: 2px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body {
    font: 14px/1 "Departure Mono", "Segoe UI", system-ui, sans-serif; color: var(--text);
    -webkit-font-smoothing: none; user-select: none;
  }
  .bar {
    height: 34px; display: flex; align-items: center; gap: 4px; padding-left: 8px;
    background: var(--panel); border-bottom: var(--px) solid var(--border);
    -webkit-app-region: drag;
  }
  /* Tab strip; the empty space around the tabs drags the window. */
  /* Clips its own overflow: with many tabs in a narrow window they never
     draw over the buttons beside them. */
  .tabs { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; gap: 2px; overflow: hidden; scroll-padding-inline-end: 64px; }
  .tab {
    -webkit-app-region: no-drag; flex: 0 1 210px; min-width: 58px; height: 28px; margin-bottom: calc(var(--px) * -1); overflow: hidden;
    display: flex; align-items: center; gap: 7px; padding: 0 4px 0 9px;
    border: var(--px) solid transparent; border-bottom: 0; color: var(--muted); cursor: default; position: relative;
  }
  .tab:hover { background: var(--tint); color: var(--text); }
  .tab.on { background: var(--bg); border-color: var(--border); color: var(--title); }
  .tab.on::before { content: ""; position: absolute; left: calc(var(--px) * -1); right: calc(var(--px) * -1); top: calc(var(--px) * -1); height: var(--px); background: var(--accent); }
  /* One tab and tabs turned off: just the page title, like before. */
  .tabs.solo .tab { background: none; border-color: transparent; color: var(--title); font-weight: 600; padding-left: 0; }
  .tabs.solo .tab::before { display: none; }
  .tab img { width: 16px; height: 16px; image-rendering: pixelated; flex-shrink: 0; }
  .tab i { width: 8px; height: 8px; margin: 0 4px; background: var(--accent); flex-shrink: 0; animation: blink .6s steps(2) infinite; }
  .tab span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Which SillyTavern a tab shows: port, version, read-only. */
  .chip { flex-shrink: 0; font-size: 12px; line-height: 1; padding: 2px 5px; color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
  /* Narrow tabs keep what tells them apart: the chip. Click, middle-click
     and Ctrl+W still close them. */
  .tab { container-type: inline-size; }
  @container (max-width: 120px) { .tab > span { display: none; } }
  @container (max-width: 84px) { .tab > img, .tab > button { display: none; } }
  .tab.ro .chip { color: var(--warn); border-color: var(--warn); }
  .tab.ro.on::before { background: var(--warn); }
  .info { flex-shrink: 1; min-width: 0; max-width: 360px; padding: 0 6px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info.ro { color: var(--warn); font-weight: 600; }
  .tab button { height: 20px; min-width: 20px; padding: 0; }
  .tab button svg { width: 12px; height: 12px; }
  /* Pinned to the right end of the strip, so they stay reachable with many tabs. */
  #btnNewTab, #btnNewMenu { margin: 0 0 3px 2px; flex-shrink: 0; position: sticky; background: var(--panel); }
  #btnNewTab { right: 24px; }
  #btnNewMenu { right: 0; }
  /* Narrow window: the active tab's details make room for the tabs (each tab's chip still shows the port). */
  @media (max-width: 860px) { .info { display: none; } }
  #btnNewMenu { min-width: 22px; padding: 0 3px; margin-left: 0; }
  @keyframes blink { 50% { opacity: 0; } }
  button {
    -webkit-app-region: no-drag; height: 26px; min-width: 30px; padding: 0 7px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: transparent; border: var(--px) solid transparent; color: var(--text); font: inherit; cursor: pointer;
  }
  button:hover { background: var(--tint); border-color: var(--border); color: var(--title); }
  button.on { color: var(--accent); border-color: var(--accent); background: var(--tint); }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; shape-rendering: crispEdges; }
  .controls { flex-shrink: 0; }
  /* Chrome extension buttons (their element draws them in its shadow DOM). */
  #crx { flex-shrink: 0; display: flex; align-items: center; -webkit-app-region: no-drag; }
  #crx browser-action-list { --browser-action-hover-bg: var(--tint); }
  #crx browser-action-list::part(action) { width: 26px; height: 26px; border-radius: 0; image-rendering: auto; }
  #crx browser-action-list::part(action):hover { outline: var(--px) solid var(--border); }
  /* Dragging a tab: it follows the mouse, the others slide out of its way. */
  .tabs.sorting .tab { transition: transform .15s ease-out; }
  .tabs.sorting .tab.dragging { transition: none; z-index: 2; background: var(--bg); border-color: var(--accent); color: var(--title); }
  .tab.dragging.out { opacity: .55; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="tabs" id="tabs"><button id="btnNewTab" title="New tab (Ctrl+T)" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="btnNewMenu" title="New SillyTavern: another tab, a read-only copy, another port or another install"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button></div>
    <div class="info" id="info"></div>
    <div id="crx"></div>
    <button id="btnReload" title="Reload (F5)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
    <button id="btnLayer" title="Window layer"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5zM3 13l9 5 9-5"/></svg><span id="layerText" hidden></span></button>
    <button id="btnFull" title="Full screen (F11)"><svg viewBox="0 0 24 24" id="icoFull"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span id="fullText" hidden>Exit full screen</span></button>
    <button id="btnMenu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="controls" id="controls"></div>
  </div>
<script>
  const $ = id => document.getElementById(id);
  const VARS = { bg: '--bg', panel: '--panel', border: '--border', accent: '--accent', text: '--text', title: '--title', muted: '--muted', warn: '--warn' };
  const LAYER_TEXT = { top: 'On top', bottom: 'In background' };
  $('btnReload').onclick = () => bar.action('reload');
  // Menus drop down from the button that opened them.
  const below = el => { const r = el.getBoundingClientRect(); return { x: Math.round(r.left), y: Math.round(r.bottom) }; };
  $('btnLayer').onclick = () => bar.action('layer-menu', { at: below($('btnLayer')) });
  $('btnFull').onclick = () => bar.action('fullscreen');
  $('btnMenu').onclick = () => bar.action('menu', { at: below($('btnMenu')) });
  $('btnNewTab').onclick = () => bar.action('tab-new');
  $('btnNewMenu').onclick = () => bar.action('new-menu', { at: below($('btnNewMenu')) });
  // Right-clicks on tabs and buttons (the drag area is handled by the window).
  document.addEventListener('contextmenu', e => {
    e.preventDefault();
    const tab = e.target.closest('.tab');
    bar.action(tab ? 'tab-menu' : 'menu', tab ? { id: +tab.dataset.id } : {});
  });

  // Tabs are kept by id so favicons don't reload on every update.
  const tabEls = new Map();
  function tabEl(id) {
    if (tabEls.has(id)) return tabEls.get(id);
    const el = document.createElement('div');
    el.className = 'tab';
    el.dataset.id = id;
    el.innerHTML = '<img alt="" hidden><i hidden></i><span></span><b class="chip"></b><button title="Close tab (Ctrl+W)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';
    el.onpointerdown = e => {
      if (e.button !== 0 || e.target.closest('button')) return;
      bar.action('tab-select', { id });
      startDrag(el, id, e);
    };
    el.onauxclick = e => { if (e.button === 1) bar.action('tab-close', { id }); }; // middle click
    el.querySelector('button').onclick = () => bar.action('tab-close', { id });
    tabEls.set(id, el);
    return el;
  }
  // ----- dragging tabs -----
  // Along the strip: reorder. Away from the bar (down or up): the tab moves
  // into its own window, or onto another SillyTavern window's tabs.
  const OUT = 28; // px beyond the bar before a drop leaves the window
  let drag = null;
  function startDrag(el, id, e) {
    el.setPointerCapture(e.pointerId);
    drag = { el, id, x0: e.clientX, moved: false, out: false, index: 0 };
    el.onpointermove = moveDrag;
    el.onpointerup = el.onpointercancel = endDrag;
  }
  function moveDrag(e) {
    const d = drag;
    if (!d) return;
    const dx = e.clientX - d.x0;
    if (!d.moved) {
      if (Math.abs(dx) < 6 && e.clientY >= -4 && e.clientY <= innerHeight + 4) return;
      d.moved = true;
      d.all = [...tabEls.values()].filter(t => t.isConnected).sort((a, b) => a.offsetLeft - b.offsetLeft);
      d.from = d.all.indexOf(d.el);
      d.rects = d.all.map(t => ({ left: t.offsetLeft, width: t.offsetWidth }));
      d.step = d.rects[d.from].width + 2; // + the strip's gap
      $('tabs').classList.add('sorting');
      d.el.classList.add('dragging');
    }
    const r = d.rects[d.from];
    // Stay within the strip while sorting.
    const min = d.rects[0].left - r.left, max = d.rects.at(-1).left + d.rects.at(-1).width - (r.left + r.width);
    const x = Math.max(min, Math.min(max, dx));
    const mid = r.left + x + r.width / 2;
    let index = 0;
    d.rects.forEach((q, i) => { if (i !== d.from && q.left + q.width / 2 < mid) index++; });
    d.index = index;
    d.all.forEach((t, i) => {
      if (t === d.el) return;
      const shift = d.from < index && i > d.from && i <= index ? -d.step : d.from > index && i >= index && i < d.from ? d.step : 0;
      t.style.transform = shift ? `translateX(${shift}px)` : '';
    });
    d.out = e.clientY > innerHeight + OUT || e.clientY < -OUT;
    d.el.classList.toggle('out', d.out);
    d.el.style.transform = `translate(${x}px, ${d.out ? Math.max(-8, Math.min(8, e.clientY - innerHeight / 2)) : 0}px)`;
  }
  function endDrag(e) {
    const d = drag;
    drag = null;
    d.el.onpointermove = d.el.onpointerup = d.el.onpointercancel = null;
    if (!d.moved) return;
    $('tabs').classList.remove('sorting');
    d.el.classList.remove('dragging', 'out');
    d.all.forEach(t => { t.style.transform = ''; });
    if (e.type === 'pointercancel') return;
    if (d.out) { bar.action('tab-detach', { id: d.id, x: e.screenX, y: e.screenY }); return; }
    if (d.index === d.from) return;
    // Show the new order at once; the window confirms it with the next state.
    const others = d.all.filter(t => t !== d.el);
    $('tabs').insertBefore(d.el, others[d.index] || $('btnNewTab'));
    bar.action('tab-move', { id: d.id, index: d.index });
  }

  function renderTabs(s) {
    const box = $('tabs');
    const ids = new Set(s.tabs.map(t => t.id));
    for (const [id, el] of tabEls) if (!ids.has(id)) { el.remove(); tabEls.delete(id); }
    s.tabs.forEach((t, i) => {
      const el = tabEl(t.id);
      const img = el.querySelector('img');
      el.classList.toggle('on', t.id === s.active);
      el.classList.toggle('ro', t.readOnly);
      el.title = t.tip ? `${t.title}\n${t.tip}` : t.title;
      el.querySelector('span').textContent = t.title;
      el.querySelector('.chip').textContent = t.chip || '';
      el.querySelector('.chip').hidden = !t.chip;
      el.querySelector('i').hidden = !t.loading;
      img.hidden = t.loading || !t.favicon;
      if (t.favicon && img.getAttribute('src') !== t.favicon) img.src = t.favicon;
      el.querySelector('button').hidden = s.tabs.length < 2;
      // Only when out of place: moving a node drops a drag's pointer capture.
      // Mid-drag the order is the user's.
      if (!drag?.moved && box.children[i] !== el) box.insertBefore(el, box.children[i]);
    });
    box.classList.toggle('solo', s.tabs.length < 2 && !s.tabsEnabled);
    $('btnNewTab').hidden = !s.tabsEnabled;
    // More tabs than fit: keep the active one in view.
    tabEls.get(s.active)?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  }
  addEventListener('resize', () => document.querySelector('.tab.on')?.scrollIntoView({ inline: 'nearest', block: 'nearest' }));

  bar.onState(s => {
    for (const [k, v] of Object.entries(VARS)) if (s.colors[k]) document.documentElement.style.setProperty(v, s.colors[k]);
    if (s.font) document.body.style.fontFamily = s.font;
    renderTabs(s);
    $('info').textContent = s.info;
    $('info').title = s.tabs.find(t => t.id === s.active)?.tip || '';
    $('info').classList.toggle('ro', s.readOnly);
    $('controls').style.width = `${s.controlsWidth}px`;
    $('btnLayer').classList.toggle('on', s.layer !== 'normal');
    $('layerText').hidden = s.layer === 'normal';
    $('layerText').textContent = LAYER_TEXT[s.layer] || '';
    $('btnFull').classList.toggle('on', s.fullScreen);
    $('fullText').hidden = !s.fullScreen;
    renderCrx(s);
  });

  // The buttons of the active tab's Chrome extensions. The element watches
  // one session from when it is added, so another session gets a new one.
  function renderCrx(s) {
    const box = $('crx');
    if (s.chromePartition == null || !customElements.get('browser-action-list')) { box.replaceChildren(); return; }
    const want = s.chromePartition || '_self';
    let list = box.firstElementChild;
    if (!list || list.dataset.partition !== want) {
      list = document.createElement('browser-action-list');
      list.dataset.partition = want;
      if (s.chromePartition) list.setAttribute('partition', s.chromePartition);
      list.setAttribute('alignment', 'bottom left');
      box.replaceChildren(list);
    }
    if (list.getAttribute('tab') !== String(s.active)) list.setAttribute('tab', String(s.active));
  }
</script>
</body>
</html>
