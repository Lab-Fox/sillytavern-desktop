<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>Co-pilot</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="row">
      <select id="sessionSel" title="Sessions"></select>
      <button id="btnNew" class="icon" title="New session">+</button>
      <button id="btnRename" class="icon" title="Rename">✎</button>
      <button id="btnDelete" class="icon" title="Delete">🗑</button>
    </div>
    <div class="row" id="renameBox" hidden><input id="renameInput" maxlength="80"><button id="btnRenameOk">Save</button></div>
    <div class="row warn" id="deleteBox" hidden><span>Delete this session?</span><button id="btnDeleteYes">Delete</button><button id="btnDeleteNo">Keep</button></div>
    <div class="row">
      <select id="profileSel" title="Connection Profile the co-pilot uses"></select>
    </div>
    <div class="where" id="profileWhere"></div>
  </header>
  <div id="state" data-state="loading" hidden></div>
  <main id="log"></main>
  <footer>
    <textarea id="input" rows="3" placeholder="Ask the co-pilot…"></textarea>
    <button id="btnSend" data-mode="send">Send</button>
  </footer>
  <script src="panel.js"></script>
</body>
</html>
